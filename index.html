// ─── HELPERS ──────────────────────────────────────────────────────────────────
function toMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function toTime(m){return`${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function fmtDur(m){return m<60?`${m}分`:(m%60===0?`${m/60}時間`:`${Math.floor(m/60)}時間${m%60}分`);}
function assignColumns(tasks){
  const sorted=[...tasks].sort((a,b)=>toMin(a.time)-toMin(b.time));
  const result=sorted.map(t=>({...t,col:0,totalCols:1}));
  for(let i=0;i<result.length;i++){
    const a=result[i],aEnd=toMin(a.time)+a.duration,ov=[a];
    for(let j=i+1;j<result.length;j++){if(toMin(result[j].time)<aEnd)ov.push(result[j]);}
    if(ov.length>1)ov.forEach((t,idx)=>{t.col=idx;t.totalCols=ov.length;});
  }
  return result;
}
const WEEKDAY_LABELS=["日","月","火","水","木","金","土"];
function repeatLabel(r){
  if(!r||r.type==="none")return null;
  if(r.type==="daily")return r.interval===1?"毎日":`${r.interval}日おき`;
  if(r.type==="weekday")return"平日";
  if(r.type==="weekly"){const d=r.days?.length?r.days.map(x=>WEEKDAY_LABELS[x]).join(""):"";return r.interval===1?`毎週${d}`:`${r.interval}週おき${d}`;}
  if(r.type==="monthly")return r.interval===1?"毎月":`${r.interval}ヶ月ごと`;
  if(r.type==="yearly")return r.interval===1?"毎年":`${r.interval}年おき`;
  return"繰り返し";
}

// ─── ICAL PARSER (RRULE対応) ──────────────────────────────────────────────────
function parseICal(icalText, targetDate) {
  // targetDate: Dateオブジェクト（表示したい日）
  const lines = icalText.split(/\r?\n/);
  const rawEvents = [];
  let cur = null;
  const tgt = targetDate || new Date();
  const tgtStart = new Date(tgt); tgtStart.setHours(0,0,0,0);
  const tgtEnd   = new Date(tgt); tgtEnd.setHours(23,59,59,999);
  const tgtDow   = tgt.getDay();

  const parseDateStr = (str) => {
    if(!str)return null;
    const clean=str.replace(/[^0-9T]/g,'');
    if(clean.includes('T')){
      const y=parseInt(clean.substring(0,4)),mo=parseInt(clean.substring(4,6))-1,
            d=parseInt(clean.substring(6,8)),h=parseInt(clean.substring(9,11)),
            mi=parseInt(clean.substring(11,13)),s=parseInt(clean.substring(13,15));
      return str.endsWith('Z')?new Date(Date.UTC(y,mo,d,h,mi,s)):new Date(y,mo,d,h,mi,s);
    } else {
      const y=parseInt(clean.substring(0,4)),mo=parseInt(clean.substring(4,6))-1,d=parseInt(clean.substring(6,8));
      return new Date(y,mo,d,0,0,0);
    }
  };
  const BYDAY_MAP={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  const parseByDay=(str)=>str.split(',').map(s=>BYDAY_MAP[s.replace(/[^A-Z]/g,'')]).filter(n=>n!==undefined);

  const getOccurrence = (ev) => {
    const start=ev.startDate;
    if(!start||!ev.rrule)return null;
    if(start>tgtEnd)return null;
    const r={};
    ev.rrule.split(';').forEach(p=>{const[k,v]=p.split('=');r[k]=v;});
    const freq=r.FREQ,interval=parseInt(r.INTERVAL||'1');
    if(r.UNTIL){const until=parseDateStr(r.UNTIL);if(until&&tgt>until)return null;}
    if(ev.exdates?.some(ex=>ex>=tgtStart&&ex<=tgtEnd))return null;
    const startDay=new Date(start);startDay.setHours(0,0,0,0);
    const diffDays=Math.round((tgtStart-startDay)/86400000);
    if(diffDays<0)return null;
    let matches=false;
    if(freq==='DAILY'){matches=diffDays%interval===0;}
    else if(freq==='WEEKLY'){
      const byDay=r.BYDAY?parseByDay(r.BYDAY):[start.getDay()];
      matches=byDay.includes(tgtDow)&&Math.floor(diffDays/7)%interval===0;
    } else if(freq==='MONTHLY'){
      const ms=(tgt.getFullYear()-start.getFullYear())*12+(tgt.getMonth()-start.getMonth());
      matches=tgt.getDate()===start.getDate()&&ms%interval===0;
    } else if(freq==='YEARLY'){
      matches=tgt.getMonth()===start.getMonth()&&tgt.getDate()===start.getDate()&&(tgt.getFullYear()-start.getFullYear())%interval===0;
    }
    if(!matches)return null;
    const occ=new Date(tgt);
    occ.setHours(start.getHours(),start.getMinutes(),start.getSeconds(),0);
    return occ;
  };

  for(let i=0;i<lines.length;i++){
    let line=lines[i];
    while(i+1<lines.length&&(lines[i+1].startsWith(' ')||lines[i+1].startsWith('\t'))){line+=lines[++i].substring(1);}
    line=line.trim();
    if(line==='BEGIN:VEVENT'){cur={exdates:[]};}
    else if(line==='END:VEVENT'){if(cur?.title&&cur.startDate)rawEvents.push(cur);cur=null;}
    else if(cur){
      if(line.startsWith('SUMMARY:'))cur.title=line.replace('SUMMARY:','').trim();
      else if(line.startsWith('DTSTART')){const v=line.split(':').slice(1).join(':');cur.startDate=parseDateStr(v);cur.isAllDay=line.includes('VALUE=DATE')&&!v.includes('T');}
      else if(line.startsWith('DTEND'))cur.endDate=parseDateStr(line.split(':').slice(1).join(':'));
      else if(line.startsWith('RRULE:'))cur.rrule=line.replace('RRULE:','').trim();
      else if(line.startsWith('EXDATE')){const ex=parseDateStr(line.split(':').slice(1).join(':'));if(ex)cur.exdates.push(ex);}
    }
  }

  const results=[];
  for(const ev of rawEvents){
    const start=ev.startDate;
    const duration=ev.endDate?Math.max(1,Math.round((ev.endDate-start)/60000)):(ev.isAllDay?60:30);
    let occDate=null;
    if(!ev.rrule){if(start>=tgtStart&&start<=tgtEnd)occDate=start;}
    else{occDate=getOccurrence(ev);}
    if(occDate){
      results.push({
        id:`google-${Date.now()}-${results.length}`,
        title:ev.title,
        time:`${String(occDate.getHours()).padStart(2,'0')}:${String(occDate.getMinutes()).padStart(2,'0')}`,
        duration:ev.isAllDay?60:duration,
        categoryId:"google",done:false,pinned:false,isGoogle:true,
        note:ev.rrule?"Googleカレンダーから同期 (繰り返し)":ev.isAllDay?"Googleカレンダーから同期 (終日)":"Googleカレンダーから同期"
      });
    }
  }
  return results;
}

// ─── タスクがその日に表示すべきか判定 ────────────────────────────────────────
function taskMatchesDate(task, dateKey) {
  const r = task.repeat;
  // 日付指定タスク（繰り返しなし・特定日）
  if (task.dateKey) return task.dateKey === dateKey;
  // 繰り返しなし・dateKey未設定 → 今日のみ
  if (!r || r.type === "none") return dateKey === todayKey();

  const tgt = keyToDate(dateKey);
  const tgtDow = tgt.getDay();
  const today = keyToDate(todayKey());

  if (r.type === "daily") {
    const diff = Math.round((tgt - today) / 86400000);
    return diff >= 0 && diff % (r.interval||1) === 0;
  }
  if (r.type === "weekday") return tgtDow >= 1 && tgtDow <= 5;
  if (r.type === "weekly") {
    const days = r.days?.length ? r.days : [today.getDay()];
    if (!days.includes(tgtDow)) return false;
    const diffW = Math.floor(Math.round((tgt - today) / 86400000) / 7);
    return diffW >= 0 && diffW % (r.interval||1) === 0;
  }
  if (r.type === "monthly") return tgt.getDate() === today.getDate();
  if (r.type === "yearly") return tgt.getDate() === today.getDate() && tgt.getMonth() === today.getMonth();
  return false;
}

function CalendarModal({selectedDateKey,onClose,onSelect}){

  const [viewMonth, setViewMonth] = useState(keyToDate(selectedDateKey).getMonth());

  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay  = new Date(viewYear, viewMonth+1, 0);
  const startDow = firstDay.getDay(); // 何曜日始まり
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=lastDay.getDate();d++) cells.push(new Date(viewYear,viewMonth,d));

  const prevMonth=()=>{if(viewMonth===0){setViewYear(y=>y-1);setViewMonth(11);}else setViewMonth(m=>m-1);};

          <div style={{fontSize:16,fontWeight:800}}>{viewYear}年{viewMonth+1}月</div>
          <button onClick={nextMonth} style={{width:32,height:32,borderRadius:"50%",border:`1px solid ${C.border}`,background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="chevR" size={16} color={C.text}/></button>
        </div>
        {/* 曜日ヘッダー */}

                <span style={{fontSize:14,fontWeight:700,color:isSelected?"#fff":isTod?C.accent:dow===0?C.red:dow===6?C.accent:C.text}}>{d.getDate()}</span>
              </button>
            );
          })}
        </div>
        <div style={{marginTop:16,display:"flex",justifyContent:"center"}}>
          <button onClick={()=>onSelect(todayKey())} style={{fontSize:12,fontWeight:700,color:C.accent,background:C.accentDim,border:`1px solid ${C.accentGlow}`,borderRadius:10,padding:"7px 20px",cursor:"pointer"}}>
            今日に戻る
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── TIMELINE VIEW ────────────────────────────────────────────────────────────
function TimelineView({tasks,now,wakeTime,sleepTime,freeThreshold,getCat,googleSyncStatus,onSyncNow,onToggleDone,onTogglePin,onDelete,onEdit}){
  const wakeMin=toMin(wakeTime),sleepMin=toMin(sleepTime);
  const isToday=now>=0;
  const pct=isToday?Math.max(0,Math.min(100,((now-wakeMin)/(sleepMin-wakeMin))*100)):0;
  const nowRef=useRef(null);
  useEffect(()=>{setTimeout(()=>nowRef.current?.scrollIntoView({behavior:"smooth",block:"center"}),200);},[]);

  const sorted=[...tasks].sort((a,b)=>toMin(a.time)-toMin(b.time));
  const withCols=assignColumns(sorted);
  const items=[];
  let cursor=wakeMin,i=0;
  while(i<withCols.length){
    const t=withCols[i],tMin=toMin(t.time);
    if(tMin-cursor>=freeThreshold)items.push({type:"free",start:cursor,end:tMin});
    const group=[t];let maxEnd=tMin+t.duration,j=i+1;
    while(j<withCols.length&&toMin(withCols[j].time)<maxEnd){group.push(withCols[j]);maxEnd=Math.max(maxEnd,toMin(withCols[j].time)+withCols[j].duration);j++;}
    items.push({type:"group",tasks:group,start:tMin,end:maxEnd});
    cursor=maxEnd;i=j;
  }
  if(sleepMin-cursor>=freeThreshold)items.push({type:"free",start:cursor,end:sleepMin});
  const googleCount=tasks.filter(t=>t.isGoogle).length;

  return(
    <div style={{padding:"0 0 20px"}}>
      {/* 同期ステータス */}
      <div style={{padding:"6px 16px 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {googleSyncStatus==="loading"&&<span style={{fontSize:11,color:C.textSub,display:"flex",alignItems:"center",gap:4}}><Icon name="sync" size={11} color={C.textSub}/>同期中…</span>}
          {googleSyncStatus==="ok"&&googleCount>0&&<span style={{fontSize:11,color:"#4285F4",display:"flex",alignItems:"center",gap:4}}><Icon name="calendar" size={11} color="#4285F4"/>🗓️ {googleCount}件</span>}
          {googleSyncStatus==="ok"&&googleCount===0&&<span style={{fontSize:11,color:C.textSub}}>Google予定なし</span>}
          {googleSyncStatus==="error"&&<span style={{fontSize:11,color:C.red}}>⚠️ Google同期失敗</span>}
        </div>
        <button onClick={onSyncNow} style={{fontSize:10,color:C.textSub,background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"2px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
          <Icon name="sync" size={10} color={C.textSub}/>更新
        </button>
      </div>
      {/* プログレスバー（今日のみ） */}
      {isToday&&(
        <div style={{padding:"10px 16px 8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.textSub,marginBottom:5}}>
            <span style={{display:"flex",alignItems:"center",gap:4}}><Icon name="sun" size={13} color={C.amber}/>{wakeTime}</span>
            <span style={{color:C.accent,fontWeight:700,fontSize:12}}>{toTime(now)}</span>
            <span style={{display:"flex",alignItems:"center",gap:4}}>{sleepTime}<Icon name="moon" size={13} color={C.textSub}/></span>
          </div>
          <div style={{background:C.surface,borderRadius:8,height:5,overflow:"hidden"}}>
            <div style={{width:`${pct}%`,height:"100%",borderRadius:8,background:`linear-gradient(90deg,${C.accent},${C.accent}bb)`,transition:"width 1s"}}/>
          </div>
        </div>
      )}
      <div style={{padding:"8px 16px 0"}}>
        {items.length===0&&<div style={{textAlign:"center",padding:"60px 20px",color:C.textSub}}><Icon name="calendar" size={48} color={C.textSub}/><div style={{marginTop:12,fontSize:13}}>この日のタスクはありません<br/>＋ボタンで追加できます</div></div>}
        {items.map((item,idx)=>{
          if(item.type==="free"){
            const isCurrent=isToday&&now>=item.start&&now<item.end;
            return(<div key={idx} style={{marginBottom:8}}>{isCurrent&&<div ref={nowRef}/>}<FreeSlot start={item.start} end={item.end} isCurrent={isCurrent} now={now}/></div>);
          }
          const isNowG=isToday&&now>=item.start&&now<item.end;
          return(
            <div key={idx} style={{marginBottom:8}}>
              {isNowG&&<div ref={nowRef}/>}
              <div style={{fontSize:11,color:C.textSub,marginBottom:4,paddingLeft:2,display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontWeight:700,color:isNowG?C.accent:C.textSub}}>{toTime(item.start)}</span>
                {isNowG&&<span style={{width:7,height:7,borderRadius:"50%",background:C.accent,display:"inline-block",boxShadow:`0 0 6px ${C.accent}`}}/>}
              </div>
              <div style={{display:"flex",gap:6}}>
                {item.tasks.map(task=>(
                  <TaskCard key={task.id} task={task} isOverlapped={item.tasks.length>1}
                    isActive={isToday&&now>=toMin(task.time)&&now<toMin(task.time)+task.duration}
                    isPast={isToday&&toMin(task.time)+task.duration<now}
                    getCat={getCat}
                    onToggleDone={()=>onToggleDone(task)}
                    onTogglePin={()=>onTogglePin(task)}
                    onDelete={()=>onDelete(task)}
                    onEdit={()=>onEdit(task)}
                  />
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function FreeSlot({start,end,isCurrent,now}){
  const dur=end-start,pct=isCurrent?Math.min(100,((now-start)/dur)*100):0;
  return(
    <div style={{border:`1px dashed ${isCurrent?C.accent+"60":C.borderStrong}`,borderRadius:14,padding:"10px 14px",background:isCurrent?C.accentDim:"transparent",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div>
        <div style={{fontSize:11,color:isCurrent?C.accent:C.textSub,fontWeight:600}}>空き時間</div>
        <div style={{fontSize:20,fontWeight:800,color:isCurrent?C.accent:C.textSub,letterSpacing:-0.5}}>{fmtDur(dur)}</div>
        <div style={{fontSize:11,color:C.textSub}}>{toTime(start)} 〜 {toTime(end)}</div>
      </div>
      {isCurrent&&(
        <div style={{width:40,height:40,borderRadius:"50%",border:`3px solid ${C.accentGlow}`,position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontSize:10,color:C.accent,fontWeight:700}}>{Math.round(pct)}%</div>
          <svg style={{position:"absolute",inset:"-3px",width:46,height:46}} viewBox="0 0 46 46">
            <circle cx="23" cy="23" r="20" fill="none" stroke={C.accent} strokeWidth="3" strokeDasharray={`${pct/100*125.7} 125.7`} strokeLinecap="round" transform="rotate(-90 23 23)" opacity="0.8"/>
          </svg>
        </div>
      )}
    </div>
  );
}

function TaskCard({task,isOverlapped,isActive,isPast,getCat,onToggleDone,onTogglePin,onDelete,onEdit}){
  const [open,setOpen]=useState(false);
  const cat=getCat(task.categoryId);
  const rep=task.isGoogle?null:repeatLabel(task.repeat);
  const ga="#4285F4";
  const border=task.isGoogle?(isActive?`${ga}99`:`${ga}44`):(isActive?C.accent+"66":C.border);
  const shadow=task.isGoogle?(isActive?`0 0 16px ${ga}44`:"none"):(isActive?`0 0 16px ${C.accentGlow}`:"none");
  return(
    <div style={{flex:1,minWidth:0,borderRadius:14,overflow:"hidden",background:C.surface,border:`1px solid ${border}`,boxShadow:shadow,opacity:isPast&&task.done?0.45:1,transition:"all 0.2s"}}>
      {task.isGoogle&&<div style={{height:3,background:`linear-gradient(90deg,${ga},${ga}88)`}}/>}
      <div style={{padding:isOverlapped?"10px":"12px 14px",cursor:"pointer"}} onClick={()=>setOpen(o=>!o)}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <div style={{fontSize:12,fontWeight:700,color:isActive?(task.isGoogle?ga:C.accent):C.textSub,display:"flex",alignItems:"center",gap:4}}>
            <Icon name="clock" size={11} color={isActive?(task.isGoogle?ga:C.accent):C.textSub}/>{task.time}
            {!isOverlapped&&<span style={{fontWeight:400,color:C.textSub}}> ({fmtDur(task.duration)})</span>}
          </div>
          <button onClick={e=>{e.stopPropagation();onToggleDone();}} style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${task.done?C.green:C.textFaint}`,background:task.done?C.green:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            {task.done&&<Icon name="checkmark" size={11} color="#000"/>}
          </button>
        </div>
        <div style={{fontSize:isOverlapped?13:15,fontWeight:600,color:task.done?C.textSub:C.text,textDecoration:task.done?"line-through":"none",marginBottom:6,lineHeight:1.3}}>{task.title}</div>
        <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
          <span style={{fontSize:10,fontWeight:700,color:cat.color,background:cat.bg,borderRadius:6,padding:"2px 7px"}}>{cat.name}</span>
          {rep&&<span style={{fontSize:10,color:C.textSub,display:"flex",alignItems:"center",gap:2}}><Icon name="repeat" size={10} color={C.textSub}/>{rep}</span>}
          {task.pinned&&<Icon name="pinFill" size={12} color={C.pink}/>}
          {isActive&&<span style={{fontSize:10,color:task.isGoogle?ga:C.accent,background:task.isGoogle?`${ga}20`:C.accentDim,borderRadius:6,padding:"2px 6px",fontWeight:700}}>進行中</span>}
          {task.isGoogle&&<span style={{fontSize:10,color:ga,display:"flex",alignItems:"center",gap:2}}><Icon name="calendar" size={10} color={ga}/>Google</span>}
          {task.dateKey&&!task.isGoogle&&<span style={{fontSize:10,color:C.amber,background:C.amberDim,borderRadius:6,padding:"2px 5px"}}>日付指定</span>}
          {task.remindMinutes!=null&&!task.isGoogle&&<span style={{fontSize:10,color:C.green,background:C.greenDim,borderRadius:6,padding:"2px 5px"}}>🔔{task.remindMinutes}分前</span>}
        </div>
      </div>
      {open&&(
        <div style={{borderTop:`1px solid ${C.border}`,padding:"8px 10px",display:"flex",gap:6,flexWrap:"wrap"}}>
          {!task.isGoogle&&<Chip icon="edit" label="編集" color={C.accent} onClick={onEdit}/>}
          {!task.isGoogle&&<Chip icon={task.pinned?"pinFill":"pin"} label={task.pinned?"外す":"ピン"} color={C.pink} onClick={onTogglePin}/>}
          {!task.isGoogle&&<Chip icon="trash" label="削除" color={C.red} onClick={onDelete}/>}
          {task.isGoogle&&<span style={{fontSize:11,color:C.textSub,padding:"4px 6px"}}>📅 Googleの予定は編集・削除できません</span>}
        </div>
      )}
    </div>
  );
}

function Chip({icon,label,color,onClick}){
  return<button onClick={onClick} style={{display:"flex",alignItems:"center",gap:4,background:color+"22",border:`1px solid ${color}44`,color,borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer"}}><Icon name={icon} size={12} color={color}/>{label}</button>;
}

// ─── STATS VIEW ───────────────────────────────────────────────────────────────
function StatsView({tasks,categories}){
  const done=tasks.filter(t=>t.done).length,total=tasks.length;
  const rate=total>0?Math.round(done/total*100):0;
  const buckets=Array.from({length:18},(_,i)=>({h:i+6,n:tasks.filter(t=>parseInt(t.time.split(":")[0])===i+6&&t.done).length}));
  const maxB=Math.max(...buckets.map(b=>b.n),1);
  return(
    <div style={{padding:16}}>
      <div style={{background:C.surface,borderRadius:18,padding:"16px 18px",marginBottom:12}}>
        <div style={{textAlign:"center",padding:"8px 0 16px"}}>
          <div style={{fontSize:56,fontWeight:900,color:C.accent,letterSpacing:-2}}>{rate}%</div>
          <div style={{color:C.textSub,fontSize:13}}>今日の完了率 ({done}/{total})</div>
          <div style={{marginTop:14,background:C.border,borderRadius:8,height:8,overflow:"hidden"}}>
            <div style={{width:`${rate}%`,height:"100%",borderRadius:8,background:`linear-gradient(90deg,${C.accent},${C.accent}bb)`,transition:"width 1s"}}/>
          </div>
        </div>
      </div>
      <div style={{background:C.surface,borderRadius:18,padding:"16px 18px",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>カテゴリ別</div>
        {categories.map(cat=>{
          const ct=tasks.filter(t=>t.categoryId===cat.id);if(!ct.length)return null;
          const cd=ct.filter(t=>t.done).length;
          return(<div key={cat.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:cat.color,fontWeight:600}}>{cat.name}</span><span style={{color:C.textSub}}>{cd}/{ct.length}</span></div><div style={{background:C.border,borderRadius:6,height:6,overflow:"hidden"}}><div style={{width:`${ct.length?cd/ct.length*100:0}%`,height:"100%",background:cat.color,borderRadius:6}}/></div></div>);
        })}
      </div>
      <div style={{background:C.surface,borderRadius:18,padding:"16px 18px"}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>時間帯別完了数</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:3,height:56}}>
          {buckets.map(b=>(
            <div key={b.h} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <div style={{width:"100%",borderRadius:3,minHeight:b.n?4:0,height:`${b.n/maxB*48}px`,background:b.n?C.accent:C.textFaint}}/>
              {b.h%3===0&&<div style={{fontSize:8,color:C.textFaint}}>{b.h}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── BOTTOM NAV ───────────────────────────────────────────────────────────────
function BottomNav({tab,setTab}){
  const items=[{id:"timeline",icon:"today",label:"今日"},{id:"later",icon:"later",label:"あとで"},{id:"stats",icon:"chart",label:"統計"},{id:"settings",icon:"gear",label:"設定"}];
  return(
    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100}}>
      {items.map(item=>(
        <button key={item.id} onClick={()=>setTab(item.id)} style={{flex:1,padding:"11px 0 8px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          <Icon name={item.icon} size={22} color={tab===item.id?C.accent:C.textSub}/>
          <span style={{fontSize:10,fontWeight:600,color:tab===item.id?C.accent:C.textSub}}>{item.label}</span>
          {tab===item.id&&<div style={{width:18,height:2,background:C.accent,borderRadius:2}}/>}
        </button>
      ))}
    </div>
  );
}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function BottomSheet({title,onClose,children}){
  return(
    <div style={{position:"fixed",inset:0,background:"#00000080",zIndex:200,display:"flex",alignItems:"flex-end"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.surface,borderRadius:"22px 22px 0 0",padding:"22px 18px",width:"100%",maxHeight:"92vh",overflowY:"auto",boxSizing:"border-box"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div style={{fontSize:17,fontWeight:800}}>{title}</div>
          <button onClick={onClose} style={{background:C.border,border:"none",borderRadius:"50%",width:28,height:28,color:C.text,cursor:"pointer",fontSize:14}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Field({label,children,style:s}){return<div style={{marginBottom:14,...s}}><div style={{fontSize:11,color:C.textSub,marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:0.8}}>{label}</div>{children}</div>;}
function Pill({label,active,color,bg,onClick}){return<button onClick={onClick} style={{padding:"5px 12px",borderRadius:10,fontSize:12,fontWeight:700,background:active?bg:"transparent",border:`1px solid ${active?color:C.border}`,color:active?color:C.textSub,cursor:"pointer"}}>{label}</button>;}

function TaskModal({initial,categories,selectedDateKey,onClose,onSave}){
  const visibleCats=categories.filter(c=>c.id!=="google");
  const def={title:"",time:toTime(nowMin()+30),duration:30,categoryId:visibleCats[0]?.id||"other",done:false,pinned:false,dateKey:null,note:"",remindMinutes:10,repeat:{type:"none",interval:1,days:[],end:{type:"none"}}};
  const [f,setF]=useState(initial?{...def,...initial}:def);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setR=(k,v)=>setF(p=>({...p,repeat:{...p.repeat,[k]:v}}));
  const setRE=(k,v)=>setF(p=>({...p,repeat:{...p.repeat,end:{...p.repeat.end,[k]:v}}}));

  // 日付指定モード
  const isDateSpecific = f.repeat?.type === "none";

  return(
    <BottomSheet title={initial?"タスクを編集":"タスクを追加"} onClose={onClose}>
      <Field label="タイトル"><input value={f.title} onChange={e=>set("title",e.target.value)} placeholder="何をしますか？" style={inputSt()} autoFocus/></Field>
      <div style={{display:"flex",gap:10}}>
        <Field label="開始時刻" style={{flex:1}}><input type="time" value={f.time} onChange={e=>set("time",e.target.value)} style={inputSt()}/></Field>
        <Field label="所要時間(分)" style={{flex:1}}><input type="number" value={f.duration} min={5} max={480} step={5} onChange={e=>set("duration",Number(e.target.value))} style={inputSt()}/></Field>
      </div>
      <Field label="カテゴリ"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{visibleCats.map(cat=><Pill key={cat.id} label={cat.name} active={f.categoryId===cat.id} color={cat.color} bg={cat.bg} onClick={()=>set("categoryId",cat.id)}/>)}</div></Field>
      <Field label="繰り返し">
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
          {[{v:"none",l:"なし（日付指定）"},{v:"daily",l:"毎日"},{v:"weekday",l:"平日"},{v:"weekly",l:"毎週"},{v:"monthly",l:"毎月"},{v:"yearly",l:"毎年"}].map(o=><Pill key={o.v} label={o.l} active={f.repeat.type===o.v} color={C.accent} bg={C.accentDim} onClick={()=>setR("type",o.v)}/>)}
        </div>
        {isDateSpecific && (
          <div style={{marginBottom:8}}>
            <FL>表示する日付</FL>
            <input type="date" value={f.dateKey||selectedDateKey} onChange={e=>set("dateKey",e.target.value)} style={inputSt()}/>
          </div>
        )}
        {!isDateSpecific&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{fontSize:11,color:C.textSub,minWidth:40}}>間隔</span>
              <input type="range" min={1} max={30} value={f.repeat.interval} onChange={e=>setR("interval",Number(e.target.value))} style={{flex:1,accentColor:C.accent}}/>
              <span style={{color:C.accent,fontWeight:700,minWidth:30}}>{f.repeat.interval}</span>
            </div>
            {f.repeat.type==="weekly"&&(
              <div style={{display:"flex",gap:6,marginBottom:8}}>
                {WEEKDAY_LABELS.map((d,i)=>{const sel=(f.repeat.days||[]).includes(i);return<button key={i} onClick={()=>setR("days",sel?f.repeat.days.filter(x=>x!==i):[...(f.repeat.days||[]),i])} style={{width:34,height:34,borderRadius:"50%",border:`1px solid ${sel?C.accent:C.border}`,background:sel?C.accentDim:"transparent",color:sel?C.accent:C.textSub,fontSize:12,fontWeight:700,cursor:"pointer"}}>{d}</button>;})}
              </div>
            )}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
              {[{v:"none",l:"終了なし"},{v:"until",l:"日付指定"},{v:"count",l:"回数指定"}].map(o=><Pill key={o.v} label={o.l} active={f.repeat.end?.type===o.v} color={C.accent} bg={C.accentDim} onClick={()=>setRE("type",o.v)}/>)}
            </div>
            {f.repeat.end?.type==="until"&&<input type="date" value={f.repeat.end.until||""} onChange={e=>setRE("until",e.target.value)} style={inputSt()}/>}
            {f.repeat.end?.type==="count"&&<div style={{display:"flex",alignItems:"center",gap:10}}><input type="number" min={1} max={100} value={f.repeat.end.count||1} onChange={e=>setRE("count",Number(e.target.value))} style={{...inputSt(),width:80}}/><span style={{color:C.textSub,fontSize:13}}>回まで</span></div>}
          </>
        )}
      </Field>
      <Field label="メモ（任意）"><input value={f.note} onChange={e=>set("note",e.target.value)} placeholder="補足など" style={inputSt()}/></Field>
      <Field label="📣 リマインド通知">
        <div style={{fontSize:11,color:C.textSub,marginBottom:8}}>タスク開始の何分前にLINEで通知しますか？</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {[{v:null,l:"なし"},{v:5,l:"5分前"},{v:10,l:"10分前"},{v:15,l:"15分前"},{v:30,l:"30分前"},{v:-1,l:"カスタム"}].map(o=>{
            const isCustom = o.v === -1;
            const active = isCustom
              ? (f.remindMinutes != null && ![null,5,10,15,30].includes(f.remindMinutes))
              : f.remindMinutes === o.v;
            return(
              <Pill key={String(o.v)} label={o.l} active={active} color={C.accent} bg={C.accentDim}
                onClick={()=>{ if(isCustom){ set("remindMinutes", 20); } else { set("remindMinutes", o.v); } }}/>
            );
          })}
        </div>
        {f.remindMinutes != null && ![null,5,10,15,30].includes(f.remindMinutes) && (
          <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
            <input type="number" min={1} max={120} value={f.remindMinutes}
              onChange={e=>set("remindMinutes",Number(e.target.value))}
              style={{...inputSt(),width:80}}/>
            <span style={{fontSize:13,color:C.textSub}}>分前</span>
          </div>
        )}
      </Field>
      <div style={{marginBottom:16}}>
        <button onClick={()=>set("pinned",!f.pinned)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:10,fontSize:12,fontWeight:700,background:f.pinned?C.pinkDim:C.surface2,border:`1px solid ${f.pinned?C.pink:C.border}`,color:f.pinned?C.pink:C.textSub,cursor:"pointer"}}>
          <Icon name={f.pinned?"pinFill":"pin"} size={13} color={f.pinned?C.pink:C.textSub}/>{f.pinned?"ピン留め中":"ピン留めする"}
        </button>
      </div>
      <button onClick={()=>{if(f.title.trim()){const saved={...f};if(saved.repeat?.type==="none"&&!saved.dateKey)saved.dateKey=selectedDateKey;onSave(saved);}}} style={{width:"100%",padding:14,borderRadius:14,fontSize:15,fontWeight:700,background:`linear-gradient(135deg,${C.accent},${C.accent}bb)`,border:"none",color:"#fff",cursor:"pointer"}}>{initial?"更新する":"追加する"}</button>
    </BottomSheet>
  );
}

function LaterModal({initial,categories,onClose,onSave}){
  const visibleCats=categories.filter(c=>c.id!=="google");
  const [title,setTitle]=useState(initial?.title||"");
  const [catId,setCatId]=useState(initial?.categoryId||visibleCats[0]?.id||"other");
  const [pinned,setPinned]=useState(initial?.pinned||false);
  return(
    <BottomSheet title={initial?"あとでやるを編集":"あとでやるに追加"} onClose={onClose}>
      <Field label="タイトル"><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="いつかやりたいこと" style={inputSt()} autoFocus/></Field>
      <Field label="カテゴリ"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{visibleCats.map(cat=><Pill key={cat.id} label={cat.name} active={catId===cat.id} color={cat.color} bg={cat.bg} onClick={()=>setCatId(cat.id)}/>)}</div></Field>
      <div style={{marginBottom:16}}>
        <button onClick={()=>setPinned(p=>!p)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:10,fontSize:12,fontWeight:700,background:pinned?C.pinkDim:C.surface2,border:`1px solid ${pinned?C.pink:C.border}`,color:pinned?C.pink:C.textSub,cursor:"pointer"}}>
          <Icon name={pinned?"pinFill":"pin"} size={13} color={pinned?C.pink:C.textSub}/>{pinned?"ピン留め中":"ピン留めする"}
        </button>
      </div>
      <button onClick={()=>{if(title.trim())onSave({...initial,title:title.trim(),categoryId:catId,pinned});}} style={{width:"100%",padding:14,borderRadius:14,fontSize:15,fontWeight:700,background:`linear-gradient(135deg,${C.amber},${C.amber}bb)`,border:"none",color:C.dark?"#000":"#fff",cursor:"pointer"}}>{initial?"更新する":"追加する"}</button>
    </BottomSheet>
  );
}

const PRESET_COLORS=["#d0a727","#667572","#a1bad0","#5a7a9a","#8a6e3a","#b85c4a","#9aaba8","#c49020","#7a9e8a","#6a7f8c"];
function CategoryModal({initial,onClose,onSave,onDelete}){
  const [name,setName]=useState(initial?.name||"");
  const [color,setColor]=useState(initial?.color||PRESET_COLORS[0]);
  return(
    <BottomSheet title={initial?"カテゴリを編集":"カテゴリを追加"} onClose={onClose}>
      <Field label="名前"><input value={name} onChange={e=>setName(e.target.value)} placeholder="カテゴリ名" style={inputSt()} autoFocus/></Field>
      <Field label="カラー">
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{PRESET_COLORS.map(c=><button key={c} onClick={()=>setColor(c)} style={{width:32,height:32,borderRadius:"50%",background:c,border:`3px solid ${color===c?"#fff":"transparent"}`,cursor:"pointer",outline:"none"}}/>)}</div>
        <div style={{marginTop:8,display:"flex",alignItems:"center",gap:10}}><div style={{width:24,height:24,borderRadius:"50%",background:color}}/><span style={{fontSize:11,color:C.textSub}}>{name||"（名前なし）"}</span></div>
      </Field>
      <button onClick={()=>{if(name.trim())onSave({...initial,name:name.trim(),color,bg:color+"22"});}} style={{width:"100%",padding:14,borderRadius:14,fontSize:15,fontWeight:700,background:`linear-gradient(135deg,${color},${color}cc)`,border:"none",color:"#fff",cursor:"pointer",marginBottom:10}}>{initial?"更新する":"追加する"}</button>
      {initial&&<button onClick={()=>{if(window.confirm(`「${initial.name}」を削除しますか？`))onDelete(initial.id);}} style={{width:"100%",padding:11,borderRadius:14,fontSize:13,fontWeight:600,background:C.redDim,border:`1px solid ${C.red}44`,color:C.red,cursor:"pointer"}}>削除する</button>}
    </BottomSheet>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
