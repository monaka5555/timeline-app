<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Any Planner Style Scheduler</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* スクロールバーの非表示（iOS/Androidアプリ風のスッキリした見た目にするため） */
    ::-webkit-scrollbar { display: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/javascript">
const { useState, useEffect, useRef, useCallback } = React;

// ─── SUPABASE SETTINGS ────────────────────────────────────────────────────────
const SUPABASE_URL = "https://your-supabase-url.supabase.co"; // 実際のURLに置き換えてください
const SUPABASE_KEY = "your-anon-key";                         // 実際のキーに置き換えてください
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── CONSTANTS & UTILS ────────────────────────────────────────────────────────
const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];

const DEFAULT_CATEGORIES = [
  { id: "work", name: "仕事", color: "#b85c4a", bg: "#b85c4a15" },
  { id: "private", name: "プライベート", color: "#5a7a9a", bg: "#5a7a9a15" },
  { id: "study", name: "勉強", color: "#7a9e8a", bg: "#7a9e8a15" },
  { id: "other", name: "その他", color: "#94a3b8", bg: "#94a3b815" },
  { id: "google", name: "Google", color: "#4285F4", bg: "#4285F415" }
];

const DEFAULT_LATER = [];

const THEMES = [
  { id: "craft", name: "Craft", emoji: "🪵", desc: "落ち着いた木目調とアースカラー", bg: "#f7f5f0", surface: "#ffffff", border: "#e4e1da", borderStrong: "#c2beb4", text: "#2c2a29", textSub: "#736e65", textFaint: "#bbb7ae", accent: "#8a6e3a", accentDim: "#8a6e3a12", accentGlow: "#8a6e3a25", green: "#4d6a55", greenDim: "#4d6a5512", amber: "#b08937", amberDim: "#b0893712", pink: "#b35c72", pinkDim: "#b35c7212", red: "#a64b42", redDim: "#a64b4212", dark: false },
  { id: "dark", name: "Charcoal", emoji: "🐈‍⬛", desc: "目に優しい漆黒のダークモード", bg: "#121212", surface: "#1e1e1e", border: "#2d2d2d", borderStrong: "#404040", text: "#e3e3e3", textSub: "#888888", textFaint: "#444444", accent: "#bb86fc", accentDim: "#bb86fc15", accentGlow: "#bb86fc30", green: "#03dac6", greenDim: "#03dac615", amber: "#cf6679", amberDim: "#cf667915", pink: "#ff7597", pinkDim: "#ff759715", red: "#cf6679", redDim: "#cf667915", dark: true }
];
let C = THEMES[0];

function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function todayKey() { return dateToKey(new Date()); }
function dateToKey(date) {
  const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, "0"), d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function keyToDate(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
function toMin(tStr) { if (!tStr) return 0; const [h, m] = tStr.split(":").map(Number); return h * 60 + m; }
function toTime(min) { const h = String(Math.floor(min / 60) % 24).padStart(2, "0"), m = String(min % 60).padStart(2, "0"); return `${h}:${m}`; }
function fmtDur(min) { if (min >= 60) { const h = Math.floor(min / 60), m = min % 60; return m ? `${h}時間${m}分` : `${h}時間`; } return `${min}分`; }
function getDoneKey(id, dateKey) { return `${id}_${dateKey}`; }

function taskMatchesDate(task, dateKey) {
  if (task.dateKey === dateKey) return true;
  if (!task.repeat || task.repeat.type === "none") return task.dateKey === dateKey;
  const tDate = keyToDate(dateKey), sDate = task.dateKey ? keyToDate(task.dateKey) : null;
  if (sDate && tDate < sDate) return false;
  if (task.repeat.end?.type === "until" && task.repeat.end.until && dateKey > task.repeat.end.until) return false;
  
  // 簡易繰り返し判定
  const diffTime = tDate.getTime() - (sDate ? sDate.getTime() : tDate.getTime());
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  const interval = task.repeat.interval || 1;
  
  switch (task.repeat.type) {
    case "daily": return diffDays % interval === 0;
    case "weekday": const dow = tDate.getDay(); return dow >= 1 && dow <= 5;
    case "weekly": return tDate.getDay() === (sDate ? sDate.getDay() : 0);
    default: return false;
  }
}

function repeatLabel(r) {
  if (!r || r.type === "none") return "";
  return { daily: "毎日", weekday: "平日", weekly: "毎週", monthly: "毎月", yearly: "毎年" }[r.type] || "";
}

// ─── OVERLAP ALGORITHM (Any Planner用の重なり検出) ───────────────────────────
function assignColumns(sortedTasks) {
  const result = [];
  let currentGroup = [];
  let groupMaxEnd = 0;

  for (const t of sortedTasks) {
    const start = toMin(t.time);
    const end = start + (t.duration || 30);

    if (currentGroup.length > 0 && start >= groupMaxEnd) {
      // 直前のグループを確定させて並列カラム数を割り当て
      assignColumnsToGroup(currentGroup);
      currentGroup = [];
      groupMaxEnd = 0;
    }

    currentGroup.push(t);
    groupMaxEnd = Math.max(groupMaxEnd, end);
  }
  if (currentGroup.length > 0) {
    assignColumnsToGroup(currentGroup);
  }
  return sortedTasks;
}

function assignColumnsToGroup(group) {
  const columns = [];
  for (const t of group) {
    const start = toMin(t.time);
    let colIndex = 0;
    while (colIndex < columns.length && columns[colIndex] > start) {
      colIndex++;
    }
    columns[colIndex] = start + (t.duration || 30);
    t.colIndex = colIndex;
  }
  for (const t of group) {
    t.colCount = columns.length;
  }
}

// ─── LOCAL STORAGE BALANCER ──────────────────────────────────────────────────
function loadData() { try { return JSON.parse(localStorage.getItem("any_planner_data")); } catch(e) { return null; } }
function saveData(obj) { try { localStorage.setItem("any_planner_data", JSON.stringify(obj)); } catch(e) {} }
function showToast(msg = "✓ 保存しました") { console.log(msg); }
function inputSt() { return { width: "100%", padding: "10px 12px", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, color: C.text, fontSize: 14, outline: "none", boxSizing: "border-box" }; }

// ─── ICON COMPONENT ───────────────────────────────────────────────────────────
function Icon({name, size=16, color="#000"}) {
  return <span style={{display:"inline-block", width:size, height:size, fontSize:size, lineHeight:1, textAlign:"center", userSelect:"none"}}>{
    { plus:"＋", gear:"⚙️", chart:"📊", today:"📅", later:"📥", edit:"✏️", trash:"🗑️", pin:"📌", pinFill:"📍", checkmark:"✓", clock:"🕒", repeat:"🔁", sync:"🔄", calendar:"🗓️", home:"🏠", chevL: "‹", chevR: "›", sun: "☀️", moon: "🌙", bell: "🔔" }[name] || "•"
  }</span>;
}

// iCal パースパーサー (簡易実装版)
function parseICal(text, targetDate) {
  if (!text) return [];
  const events = [];
  const lines = text.split(/\r?\n/);
  let cur = null;
  const targetStr = dateToKey(targetDate).replace(/-/g, "");

  for (let line of lines) {
    if (line.startsWith("BEGIN:VEVENT")) cur = {};
    else if (line.startsWith("END:VEVENT") && cur) {
      if (cur.startStr && cur.startStr.startsWith(targetStr) && cur.summary) {
        const timeStr = `${cur.startStr.substring(8,10)}:${cur.startStr.substring(10,12)}`;
        const endMin = cur.endStr ? parseInt(cur.endStr.substring(8,10))*60 + parseInt(cur.endStr.substring(10,12)) : toMin(timeStr)+60;
        const duration = endMin - toMin(timeStr);
        events.push({
          id: cur.uid || Math.random().toString(),
          title: cur.summary,
          time: timeStr,
          duration: duration > 0 ? duration : 30,
          categoryId: "google",
          isGoogle: true,
          done: false
        });
      }
      cur = null;
    } else if (cur && line.includes(":")) {
      const idx = line.indexOf(":");
      const key = line.substring(0, idx), val = line.substring(idx + 1);
      if (key.startsWith("DTSTART")) cur.startStr = val;
      else if (key.startsWith("DTEND")) cur.endStr = val;
      else if (key === "SUMMARY") cur.summary = val;
      else if (key === "UID") cur.uid = val;
    }
  }
  return events;
}

// ─── APP COMPONENT ────────────────────────────────────────────────────────────
function App(){
  const saved = loadData();

  const [tab, setTab]           = useState("timeline");
  const [tasks, setTasks]       = useState([]);
  const [doneMap, setDoneMap]   = useState(saved?.doneMap || {});
  const [googleTasks, setGoogleTasks]   = useState([]);
  const [googleSyncStatus, setGoogleSyncStatus] = useState("idle");
  const [icalRaw, setIcalRaw]   = useState(null);
  const [later, setLater]       = useState(saved?.later || DEFAULT_LATER);
  const [categories, setCategories] = useState(saved?.categories || DEFAULT_CATEGORIES);
  const [wakeTime, setWakeTime] = useState(saved?.settings?.wakeTime || "07:00");
  const [sleepTime, setSleepTime] = useState(saved?.settings?.sleepTime || "23:00");
  const [freeThreshold, setFreeThreshold] = useState(saved?.settings?.freeThreshold || 20);
  const [themeId, setThemeId]   = useState(saved?.settings?.themeId || "craft");
  const [now, setNow]           = useState(nowMin());
  const [modal, setModal]       = useState(null);
  const [selectedDateKey, setSelectedDateKey] = useState(todayKey());

  async function loadTasksFromSupabase() {
    try {
      const { data, error } = await supabase.from("tasks").select("*").order("time");
      if (error) { console.error("Supabase読込エラー:", error.message); return; }
      if (!data || data.length === 0) return;
      const loaded = data.map(row => ({
        id: row.id, title: row.title, time: row.time,
        duration: row.duration || 30, categoryId: row.category_id || "other",
        done: row.done || false, pinned: row.pinned || false, note: row.note || "",
        dateKey: row.date_key || null,
        repeat: row.repeat ? (typeof row.repeat === "string" ? JSON.parse(row.repeat) : row.repeat) : { type: "none", interval: 1, end: { type: "none" } },
        remindMinutes: row.remind_minutes ?? null,
      }));
      setTasks(loaded);
    } catch (e) { console.error("Supabase読込失敗:", e?.message); }
  }

  async function loadCategoriesFromSupabase() {
    const { data, error } = await supabase.from("categories").select("*").order("sort_order");
    if (error || !data || data.length === 0) return;
    setCategories(data.map(row => ({ id: row.id, name: row.name, color: row.color, bg: row.bg })));
  }

  async function loadLaterFromSupabase() {
    const { data, error } = await supabase.from("later").select("*").order("created_at");
    if (error || !data || data.length === 0) return;
    setLater(data.map(row => ({ id: row.id, title: row.title, categoryId: row.category_id, note: row.note || "", pinned: row.pinned || false })));
  }

  C = THEMES.find(t => t.id === themeId) || THEMES[0];

  const fetchGoogleCalendar = useCallback(async (dateKey) => {
    const target = dateKey || selectedDateKey;
    setGoogleSyncStatus("loading");
    const icalUrl = "https://calendar.google.com/calendar/ical/sa712ys%40gmail.com/private-11d3de61a5a57165c6b0bf9419905b9f/basic.ics";
    const proxies = [`https://ical-proxy.sa712ys.workers.dev/?url=${encodeURIComponent(icalUrl)}`];
    const fetchWithTimeout = (url, ms) => Promise.race([
      fetch(url),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),ms))
    ]);
    let text = icalRaw;
    if (!text) {
      let lastErr = null;
      for (const proxyUrl of proxies) {
        try {
          const res = await fetchWithTimeout(proxyUrl, 8000);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          text = await res.text();
          if (!text.includes("BEGIN:VCALENDAR")) throw new Error("Invalid iCal");
          setIcalRaw(text);
          break;
        } catch(e) { console.warn("プロキシ失敗:", e.message); lastErr = e; }
      }
      if (!text) { console.error("全プロキシ失敗:", lastErr); setGoogleSyncStatus("error"); return; }
    }
    const parsed = parseICal(text, keyToDate(target));
    setGoogleTasks(parsed);
    setGoogleSyncStatus("ok");
  }, [selectedDateKey, icalRaw]);

  useEffect(() => {
    if (icalRaw) {
      const parsed = parseICal(icalRaw, keyToDate(selectedDateKey));
      setGoogleTasks(parsed);
    }
  }, [selectedDateKey]);

  useEffect(() => {
    saveData({doneMap, categories, settings:{wakeTime,sleepTime,freeThreshold,themeId}});
  }, [doneMap, categories, wakeTime, sleepTime, freeThreshold, themeId]);

  useEffect(() => {
    loadTasksFromSupabase();
    loadCategoriesFromSupabase();
    loadLaterFromSupabase();
    const pollIv = setInterval(() => {
      loadTasksFromSupabase();
      loadLaterFromSupabase();
    }, 5000);
    return () => { clearInterval(pollIv); };
  }, []);

  useEffect(() => {
    fetchGoogleCalendar(selectedDateKey);
    const iv = setInterval(() => setNow(nowMin()), 30000);
    const calIv = setInterval(() => { setIcalRaw(null); fetchGoogleCalendar(selectedDateKey); }, 60000);
    return () => { clearInterval(iv); clearInterval(calIv); };
  }, []);

  const dayTasks = tasks.filter(t => taskMatchesDate(t, selectedDateKey));
  const getTaskDone = (task) => doneMap[getDoneKey(task.id, selectedDateKey)] ?? task.done;
  const setTaskDone = (task, val) => setDoneMap(p => ({...p, [getDoneKey(task.id, selectedDateKey)]: val}));
  const combinedTasks = [
    ...dayTasks.map(t => ({...t, done: getTaskDone(t)})),
    ...googleTasks,
  ];

  useEffect(() => { document.body.style.background = C.bg; }, [themeId]);

  const getCat = (id) => categories.find(c => c.id === id) || {name:"その他",color:"#94a3b8",bg:"#94a3b822"};
  const isToday = selectedDateKey === todayKey();
  const doneCount = combinedTasks.filter(t => t.done).length;
  const pinnedTasks = combinedTasks.filter(t => t.pinned);
  const pinnedLater = later.filter(t => t.pinned);

  const handleToggleDone = async (task) => {
    if (task.isGoogle) {
      setGoogleTasks(p => p.map(t => t.id===task.id ? {...t,done:!t.done} : t));
    } else {
      const newDone = !getTaskDone(task);
      setTaskDone(task, newDone);
      const isRepeat = task.repeat && task.repeat.type !== "none";
      if (!isRepeat) {
        await supabase.from("tasks").update({ done: newDone }).eq("id", task.id);
      }
    }
  };

  const handleTogglePin = async (task) => {
    if (task.isGoogle) return;
    const newPinned = !task.pinned;
    setTasks(p => p.map(t => t.id===task.id ? {...t,pinned:newPinned} : t));
    await supabase.from("tasks").update({ pinned: newPinned }).eq("id", task.id);
  };

  const handleDelete = async (task) => {
    if (task.isGoogle) { alert("Googleカレンダーの予定はカレンダーアプリ側から削除してください"); return; }
    setTasks(p => p.filter(t => t.id !== task.id));
    await supabase.from("tasks").delete().eq("id", task.id);
  };

  const handleSyncNow = () => { setIcalRaw(null); fetchGoogleCalendar(selectedDateKey); };

  async function saveTasksToSupabase(taskList) {
    const rows = taskList.filter(t => !t.isGoogle).map(t => ({
      id: t.id, date_key: t.dateKey || null, title: t.title, time: t.time,
      duration: t.duration || 0, category_id: t.categoryId || "",
      category_name: getCat(t.categoryId)?.name || "",
      done: !!t.done, pinned: !!t.pinned,
      remind_minutes: t.remindMinutes ?? null,
      note: t.note || "",
      repeat: t.repeat ? JSON.stringify(t.repeat) : null,
    }));
    const { error } = await supabase.from("tasks").upsert(rows, { onConflict: "id" });
    if (error) { console.error("Supabase保存エラー:", error.message); showToast("❌ 保存失敗"); }
  }

  const handleSyncSpreadsheet = async () => {
    await saveTasksToSupabase(tasks);
    alert(`✅ Supabaseに同期しました！ (${tasks.filter(t=>!t.isGoogle).length}件)`);
  };

  return (
    <div style={{background:C.bg,minHeight:"100vh",maxWidth:430,margin:"0 auto",color:C.text,fontFamily:"-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif",paddingBottom:90}}>
      <Header
        tab={tab} doneCount={doneCount} totalCount={combinedTasks.length}
        pinnedTasks={pinnedTasks} pinnedLater={pinnedLater} getCat={getCat}
        setTab={setTab} selectedDateKey={selectedDateKey} setSelectedDateKey={setSelectedDateKey}
      />
      {tab==="timeline" && (
        <TimelineView
          tasks={combinedTasks} now={isToday ? now : -1}
          wakeTime={wakeTime} sleepTime={sleepTime} freeThreshold={freeThreshold}
          getCat={getCat} googleSyncStatus={googleSyncStatus} onSyncNow={handleSyncNow}
          onToggleDone={handleToggleDone} onTogglePin={handleTogglePin} onDelete={handleDelete}
          onEdit={t => { if(t.isGoogle){alert("Googleカレンダーの予定は編集できません");return;} setModal({type:"task",data:t}); }}
        />
      )}
      {tab==="later" && (
        <LaterView items={later} setLater={setLater} getCat={getCat}
          onPromote={item => {
            setTasks(p=>[...p,{id:Date.now(),title:item.title,time:toTime(nowMin()+30),duration:30,categoryId:item.categoryId,done:false,pinned:false,dateKey:selectedDateKey,repeat:{type:"none",interval:1,end:{type:"none"}},note:"",remindMinutes:null}]);
            setLater(p=>p.filter(x=>x.id!==item.id));
          }}
          onEdit={item=>setModal({type:"later",data:item})}
        />
      )}
      {tab==="stats"    && <StatsView tasks={combinedTasks} categories={categories}/>}
      {tab==="settings" && (
        <SettingsView wakeTime={wakeTime} setWakeTime={setWakeTime}
          sleepTime={sleepTime} setSleepTime={setSleepTime}
          freeThreshold={freeThreshold} setFreeThreshold={setFreeThreshold}
          categories={categories} setCategories={setCategories}
          themeId={themeId} setThemeId={setThemeId}
          googleSyncStatus={googleSyncStatus} onSyncNow={handleSyncNow}
          onSyncSpreadsheet={handleSyncSpreadsheet}
          onEditCat={c=>setModal({type:"category",data:c})} onAddCat={()=>setModal({type:"category",data:null})}
        />
      )}

      {(tab==="timeline"||tab==="later") && (
        <button onClick={()=>setModal({type:tab==="timeline"?"task":"later",data:null})}
          style={{position:"fixed",bottom:90,right:20,width:52,height:52,borderRadius:"50%",
          background:`linear-gradient(135deg,${C.accent},${C.accent}bb)`,border:"none",color:"#fff",
          boxShadow:`0 4px 20px ${C.accentGlow}`,cursor:"pointer",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <Icon name="plus" size={22} color="#fff"/>
        </button>
      )}

      <BottomNav tab={tab} setTab={setTab}/>

      {modal?.type==="task" && (
        <TaskModal initial={modal.data} categories={categories} selectedDateKey={selectedDateKey}
          onClose={()=>setModal(null)}
          onSave={async t=>{
            let newTasks;
            if(t.id) { newTasks = tasks.map(x=>x.id===t.id?t:x); }
            else { newTasks = [...tasks,{...t,id:Date.now()}]; }
            setTasks(newTasks);
            setModal(null);
            await saveTasksToSupabase(newTasks);
            showToast();
          }}
        />
      )}
      {modal?.type==="later" && (
        <LaterModal initial={modal.data} categories={categories} onClose={()=>setModal(null)}
          onSave={async item=>{
            const isNew = !item.id;
            const newItem = isNew ? {...item, id: Date.now().toString()} : item;
            if(isNew) setLater(p=>[...p, newItem]);
            else setLater(p=>p.map(x=>x.id===item.id?item:x));
            setModal(null);
            await supabase.from("later").upsert({
              id: newItem.id, title: newItem.title,
              category_id: newItem.categoryId, note: newItem.note || "",
              pinned: newItem.pinned || false,
            }, { onConflict: "id" });
            showToast();
          }}
        />
      )}
      {modal?.type==="calendar" && (
        <CalendarModal selectedDateKey={selectedDateKey}
          onClose={()=>setModal(null)}
          onSelect={key=>{setSelectedDateKey(key);setModal(null);}}
        />
      )}
      {modal?.type==="category" && (
        <CategoryModal initial={modal.data} onClose={()=>setModal(null)}
          onSave={async cat=>{
            const isNew = !categories.find(c=>c.id===cat.id);
            const newCat = isNew ? {...cat, id: Date.now().toString()} : cat;
            if(isNew) setCategories(p=>[...p, newCat]);
            else setCategories(p=>p.map(c=>c.id===cat.id?cat:c));
            setModal(null);
            await supabase.from("categories").upsert({
              id: newCat.id, name: newCat.name, color: newCat.color, bg: newCat.bg,
              sort_order: categories.length
            }, { onConflict: "id" });
          }}
          onDelete={async id=>{
            setCategories(p=>p.filter(c=>c.id!==id));
            setModal(null);
            await supabase.from("categories").delete().eq("id", id);
          }}
        />
      )}
    </div>
  );
}

// ─── HEADER ───────────────────────────────────────────────────────────────────
function Header({tab,doneCount,totalCount,pinnedTasks,pinnedLater,getCat,setTab,selectedDateKey,setSelectedDateKey}){
  const titles={timeline:"タイムライン",later:"あとでやる",stats:"統計",settings:"設定"};
  const selDate = keyToDate(selectedDateKey);
  const isToday = selectedDateKey === todayKey();
  const [showCalModal, setShowCalModal] = useState(false);
  const weekDays = Array.from({length:7},(_,i)=>addDays(new Date(), i-3));

  return (
    <div style={{padding:"16px 16px 0",position:"sticky",top:0,zIndex:50,background:C.bg,borderBottom:`1px solid ${C.border}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:15,fontWeight:800,letterSpacing:-0.5}}>{titles[tab]}</div>
        {tab==="timeline" && (
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{background:C.accentDim,border:`1px solid ${C.accentGlow}`,borderRadius:20,padding:"4px 12px",fontSize:12,color:C.accent,fontWeight:700}}>{doneCount}/{totalCount}</div>
            {!isToday && (
              <button onClick={()=>setSelectedDateKey(todayKey())}

// ─── MONTH CALENDAR MODAL ─────────────────────────────────────────────────────
function CalendarModal({selectedDateKey,onClose,onSelect}){
  const [viewYear, setViewYear]   = useState(keyToDate(selectedDateKey).getFullYear());
  const [viewMonth, setViewMonth] = useState(keyToDate(selectedDateKey).getMonth());

  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay  = new Date(viewYear, viewMonth+1, 0);
  const startDow = firstDay.getDay();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=lastDay.getDate();d++) cells.push(new Date(viewYear,viewMonth,d));

  const prevMonth=()=>{if(viewMonth===0){setViewYear(y=>y-1);setViewMonth(11);}else setViewMonth(m=>m-1);};
  const nextMonth=()=>{if(viewMonth===11){setViewYear(y=>y+1);setViewMonth(0);}else setViewMonth(m=>m+1);};

  return(
    <div style={{position:"fixed",inset:0,background:"#00000080",zIndex:300,display:"flex",alignItems:"flex-end"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.surface,borderRadius:"22px 22px 0 0",padding:"20px 16px 32px",width:"100%",maxWidth:430,margin:"0 auto",boxSizing:"border-box"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <button onClick={prevMonth} style={{width:32,height:32,borderRadius:"50%",border:`1px solid ${C.border}`,background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="chevL" size={16} color={C.text}/></button>
          <div style={{fontSize:16,fontWeight:800}}>{viewYear}年{viewMonth+1}月</div>
          <button onClick={nextMonth} style={{width:32,height:32,borderRadius:"50%",border:`1px solid ${C.border}`,background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="chevR" size={16} color={C.text}/></button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:6}}>
          {WEEKDAY_LABELS.map((d,i)=><div key={i} style={{textAlign:"center",fontSize:11,fontWeight:700,color:i===0?C.red:i===6?C.accent:C.textSub,padding:"4px 0"}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
          {cells.map((d,i)=>{
            if(!d) return <div key={i}/>;
            const key=dateToKey(d);
            const isSelected=key===selectedDateKey;
            const isTod=key===todayKey();
            const dow=d.getDay();
            return(
              <button key={i} onClick={()=>onSelect(key)} style={{
                padding:"7px 0",borderRadius:10,border:`1px solid ${isSelected?C.accent:isTod?C.accentGlow:"transparent"}`,
                background:isSelected?C.accent:isTod?C.accentDim:"transparent",
                cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:1,
              }}>
                <span style={{fontSize:14,fontWeight:700,color:isSelected?"#fff":isTod?C.accent:dow===0?C.red:dow===6?C.accent:C.text}}>{d.getDate()}</span>
              </button>
            );
          })}
        </div>
        <div style={{marginTop:16,display:"flex",justifyContent:"center"}}>
          <button onClick={()=>onSelect(todayKey())} style={{fontSize:12,fontWeight:700,color:C.accent,background:C.accentDim,border:`1px solid ${C.accentGlow}`,borderRadius:10,padding:"7px 20px",cursor:"pointer"}}>
            今日に戻る
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── REVOLUTIONIZED TIMELINE VIEW (Any Planner 縦軸一体型スタイル) ─────────────
function TimelineView({tasks,now,wakeTime,sleepTime,freeThreshold,getCat,googleSyncStatus,onSyncNow,onToggleDone,onTogglePin,onDelete,onEdit}){
  const isToday = now >= 0;
  
  // 描画倍率設定 (1分あたり何pxにするか)
  const pxPerMin = 1.3;
  const hourHeight = 60 * pxPerMin; // 1時間 = 78px
  
  // 0時から23時までの固定タイムラインを構築
  const hours = Array.from({length: 24}, (_, i) => i);
  
  // タスクの重複重複検知・重なりカラム設定の適用
  const sorted = [...tasks].sort((a,b) => toMin(a.time) - toMin(b.time));
  const processedTasks = assignColumns(sorted);

  // 空き時間インジケーターの動的算出
  const freeSlots = [];
  let cursor = 0; // 0分(00:00)から追跡
  for (const t of processedTasks) {
    const tStart = toMin(t.time);
    if (tStart - cursor >= freeThreshold) {
      freeSlots.push({ start: cursor, end: tStart });
    }
    cursor = Math.max(cursor, tStart + (t.duration || 30));
  }
  if (1440 - cursor >= freeThreshold) {
    freeSlots.push({ start: cursor, end: 1440 });
  }

  const nowRef = useRef(null);
  useEffect(() => {
    if (isToday) {
      setTimeout(() => nowRef.current?.scrollIntoView({behavior:"smooth", block:"center"}), 300);
    }
  }, [isToday]);

  const googleCount = tasks.filter(t => t.isGoogle).length;

  return(
    <div style={{padding:"0 0 20px"}}>
      {/* 同期ステータスヘッダー */}
      <div style={{padding:"8px 16px 4px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:`1px solid ${C.border}55`}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {googleSyncStatus==="loading"&&<span style={{fontSize:11,color:C.textSub,display:"flex",alignItems:"center",gap:4}}><Icon name="sync" size={11} color={C.textSub}/>同期中…</span>}
          {googleSyncStatus==="ok"&&googleCount>0&&<span style={{fontSize:11,color:"#4285F4",display:"flex",alignItems:"center",gap:4}}><Icon name="calendar" size={11} color="#4285F4"/>🗓️ Google {googleCount}件</span>}
          {googleSyncStatus==="ok"&&googleCount===0&&<span style={{fontSize:11,color:C.textSub}}>Google予定なし</span>}
          {googleSyncStatus==="error"&&<span style={{fontSize:11,color:C.red}}>⚠️ 同期失敗</span>}
        </div>
        <button onClick={onSyncNow} style={{fontSize:10,color:C.textSub,background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"2px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:3}}>
          <Icon name="sync" size={10} color={C.textSub}/>同期
        </button>
      </div>

      {/* 24時間 バーティカル時間軸タイムライン */}
      <div style={{position: "relative", width: "100%", height: 24 * hourHeight, marginTop: 10, boxSizing: "border-box"}}>
        
        {/* 背景：時間区切りライングリッド */}
        {hours.map(h => (
          <div key={h} style={{
            position: "absolute",
            top: h * hourHeight,
            left: 0,
            width: "100%",
            height: hourHeight,
            borderTop: `1px solid ${C.border}45`,
            pointerEvents: "none",
            display: "flex",
            alignItems: "flex-start"
          }}>
            {/* 左側：時間テキスト軸領域 */}
            <div style={{
              width: 54,
              fontSize: 11,
              fontWeight: 700,
              color: C.textSub,
              textAlign: "right",
              paddingRight: 8,
              marginTop: -6,
              fontFamily: "monospace",
              letterSpacing: -0.2
            }}>
              {String(h).padStart(2, "0")}:00
            </div>
            {/* 右側：コンテンツ領域用縦境界線 */}
            <div style={{
              flex: 1,
              height: "100%",
              borderLeft: `1px solid ${C.border}88`
            }} />
          </div>
        ))}

        {/* タイムライン領域の空き時間レイヤー */}
        {freeSlots.map((slot, idx) => {
          const top = slot.start * pxPerMin;
          const height = (slot.end - slot.start) * pxPerMin;
          const isCurrent = isToday && now >= slot.start && now < slot.end;
          return (
            <div key={`free-${idx}`} style={{
              position: "absolute",
              top: top,
              left: 64,
              right: 16,
              height: height - 2,
              border: `1px dashed ${isCurrent ? C.accent + "88" : C.borderStrong + "55"}`,
              borderRadius: 8,
              background: isCurrent ? C.accentDim : "transparent",
              padding: "2px 8px",
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              overflow: "hidden",
              pointerEvents: "none"
            }}>
              <span style={{fontSize: 10, color: isCurrent ? C.accent : C.textSub, fontWeight: 600}}>
                空き {fmtDur(slot.end - slot.start)} ({toTime(slot.start)}〜)
              </span>
            </div>
          );
        })}

        {/* タイムライン領域のタスクカード絶対配置プロット */}
        {processedTasks.map(task => {
          const startMin = toMin(task.time);
          const top = startMin * pxPerMin;
          const height = Math.max(26, (task.duration || 30) * pxPerMin); // 最低高さを確保して文字潰れ防止

          // カラム分割計算 (重なりを綺麗に横並びにする)
          const colCount = task.colCount || 1;
          const colIndex = task.colIndex || 0;
          const leftOffset = 60 + ((354 / colCount) * colIndex);
          const blockWidth = (354 / colCount) - 4;

          return (
            <div key={task.id} style={{
              position: "absolute",
              top: top,
              left: leftOffset,
              width: blockWidth,
              height: height - 2,
              zIndex: 10,
              boxSizing: "border-box"
            }}>
              <TaskCard
                task={task}
                isOverlapped={colCount > 1}
                isActive={isToday && now >= startMin && now < startMin + (task.duration || 30)}
                isPast={isToday && startMin + (task.duration || 30) < now}
                getCat={getCat}
                onToggleDone={onToggleDone}
                onTogglePin={onTogglePin}
                onDelete={onDelete}
                onEdit={onEdit}
                compactMode={height < 45}
              />
            </div>
          );
        })}

        {/* リアルタイム現在時刻バー赤ラインインジケーター */}
        {isToday && (
          <div ref={nowRef} style={{
            position: "absolute",
            top: now * pxPerMin,
            left: 0,
            right: 0,
            height: 2,
            background: C.red,
            zIndex: 40,
            pointerEvents: "none",
            display: "flex",
            alignItems: "center"
          }}>
            <div style={{
              background: C.red,
              color: "#fff",
              fontSize: 8,
              fontWeight: 800,
              padding: "1px 3px",
              borderRadius: 4,
              marginLeft: 4,
              transform: "translateY(-0.5px)",
              fontFamily: "monospace"
            }}>
              {toTime(now)}
            </div>
            <div style={{flex: 1, height: 1, borderTop: `1px dotted ${C.red}`}} />
          </div>
        )}
      </div>
    </div>
  );
}

// 空き時間カードはタイムライン一体化に伴いFreeSlotコンポーネントからタイムライン内インラインインジケーターへ統合されました。

function TaskCard({task,isOverlapped,isActive,isPast,getCat,onToggleDone,onTogglePin,onDelete,onEdit,compactMode}){
  const [open,setOpen]=useState(false);
  const cat=getCat(task.categoryId);
  const rep=task.isGoogle?null:repeatLabel(task.repeat);
  const ga="#4285F4";
  const border=task.isGoogle?(isActive?`${ga}99`:`${ga}44`):(isActive?C.accent+"66"+"" :C.border);
  const shadow=task.isGoogle?(isActive?`0 0 12px ${ga}44`:"none"):(isActive?`0 0 12px ${C.accentGlow}`:"none");
  
  return(
    <div style={{width:"100%", height:"100%", borderRadius:8, overflow:"hidden", background:C.surface, border:`1px solid ${border}`, boxShadow:shadow, opacity:isPast&&task.done?0.5:1, transition:"all 0.2s", display:"flex", flexDirection:"column"}}>
      {task.isGoogle&&<div style={{height:2, background:`linear-gradient(90deg,${ga},${ga}88)`}}/>}
      
      <div style={{padding: isOverlapped?"6px":"8px 10px", cursor:"pointer", flex: 1, minHeight: 0, display: "flex", flexDirection: "column", justifyContent: compactMode ? "center" : "space-between"}} onClick={()=>setOpen(o=>!o)}>
        
        {/* 上段：時間・チェックボタン (超コンパクト時は非表示化させてタイトル優先) */}
        {!compactMode && (
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}>
            <div style={{fontSize:10,fontWeight:700,color:isActive?(task.isGoogle?ga:C.accent):C.textSub,display:"flex",alignItems:"center",gap:2}}>
              <Icon name="clock" size={10} color={isActive?(task.isGoogle?ga:C.accent):C.textSub}/>{task.time}
            </div>
            <button onClick={e=>{e.stopPropagation();onToggleDone();}} style={{width:16,height:16,borderRadius:"50%",border:`1.5px solid ${task.done?C.green:C.textFaint}`,background:task.done?C.green:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {task.done&&<Icon name="checkmark" size={9} color="#000"/>}
            </button>
          </div>
        )}

        {/* 中段：タイトル */}
        <div style={{
          fontSize: compactMode || isOverlapped ? 11 : 13,
          fontWeight: 700,
          color: task.done ? C.textSub : C.text,
          textDecoration: task.done ? "line-through" : "none",
          whiteSpace: "nowrap",
          overflow: "hidden",
          textOverflow: "ellipsis",
          lineHeight: 1.2
        }}>
          {task.title}
        </div>

        {/* 下段：メタタグバッジ群 (超コンパクト時は非表示化) */}
        {!compactMode && (
          <div style={{display:"flex",alignItems:"center",gap:3,marginTop:2,overflow:"hidden",whiteSpace:"nowrap"}}>
            <span style={{fontSize:8,fontWeight:700,color:cat.color,background:cat.bg,borderRadius:4,padding:"1px 4px"}}>{cat.name}</span>
            {task.pinned&&<Icon name="pinFill" size={9} color={C.pink}/>}
            {task.isGoogle&&<span style={{fontSize:8,color:ga}}><Icon name="calendar" size={8} color={ga}/></span>}
          </div>
        )}
      </div>

      {/* タップ展開時の編集ドロップダウンアクションパネル */}
      {open&&(
        <div style={{borderTop:`1px solid ${C.border}`,padding:"4px",background:C.bg,display:"flex",gap:4,flexWrap:"wrap",zIndex:20,position:"absolute",left:0,right:0,top:"100%",boxShadow:`0 4px 12px #00000020`,borderRadius:8}}>
          {!task.isGoogle&&<Chip icon="edit" label="編集" color={C.accent} onClick={onEdit}/>}
          {!task.isGoogle&&<Chip icon={task.pinned?"pinFill":"pin"} label={task.pinned?"外す":"ピン"} color={C.pink} onClick={onTogglePin}/>}
          {!task.isGoogle&&<Chip icon="trash" label="削除" color={C.red} onClick={onDelete}/>}
          {task.isGoogle&&<span style={{fontSize:9,color:C.textSub,padding:"2px 4px"}}>📅 Googleカレンダー固定</span>}
        </div>
      )}
    </div>
  );
}

function Chip({icon,label,color,onClick}){
  return<button onClick={onClick} style={{display:"flex",alignItems:"center",gap:3,background:color+"22",border:`1px solid ${color}44`,color,borderRadius:6,padding:"3px 8px",fontSize:10,fontWeight:600,cursor:"pointer"}}><Icon name={icon} size={10} color={color}/>{label}</button>;
}

// ─── LATER VIEW ───────────────────────────────────────────────────────────────

    </div>
  );

// ─── STATS VIEW ───────────────────────────────────────────────────────────────
function StatsView({tasks,categories}){
  const done=tasks.filter(t=>t.done).length,total=tasks.length;
  const rate=total>0?Math.round(done/total*100):0;
  const buckets=Array.from({length:18},(_,i)=>({h:i+6,n:tasks.filter(t=>parseInt(t.time.split(":")[0])===i+6&&t.done).length}));
  const maxB=Math.max(...buckets.map(b=>b.n),1);
  return(
    <div style={{padding:16}}>
      <div style={{background:C.surface,borderRadius:18,padding:"16px 18px",marginBottom:12}}>
        <div style={{textAlign:"center",padding:"8px 0 16px"}}>
          <div style={{fontSize:56,fontWeight:900,color:C.accent,letterSpacing:-2}}>{rate}%</div>
          <div style={{color:C.textSub,fontSize:13}}>今日の完了率 ({done}/{total})</div>
          <div style={{marginTop:14,background:C.border,borderRadius:8,height:8,overflow:"hidden"}}>
            <div style={{width:`${rate}%`,height:"100%",borderRadius:8,background:`linear-gradient(90deg,${C.accent},${C.accent}bb)`,transition:"width 1s"}}/>
          </div>
        </div>
      </div>
      <div style={{background:C.surface,borderRadius:18,padding:"16px 18px",marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>カテゴリ別</div>
        {categories.map(cat=>{
          const ct=tasks.filter(t=>t.categoryId===cat.id);if(!ct.length)return null;
          const cd=ct.filter(t=>t.done).length;
          return(<div key={cat.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:cat.color,fontWeight:600}}>{cat.name}</span><span style={{color:C.textSub}}>{cd}/{ct.length}</span></div><div style={{background:C.border,borderRadius:6,height:6,overflow:"hidden"}}><div style={{width:`${ct.length?cd/ct.length*100:0}%`,height:"100%",background:cat.color,borderRadius:6}}/></div></div>);
        })}
      </div>
      <div style={{background:C.surface,borderRadius:18,padding:"16px 18px"}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>時間帯別完了数</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:3,height:56}}>
          {buckets.map(b=>(
            <div key={b.h} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <div style={{width:"100%",borderRadius:3,minHeight:b.n?4:0,height:`${b.n/maxB*48}px`,background:b.n?C.accent:C.textFaint}}/>
              {b.h%3===0&&<div style={{fontSize:8,color:C.textFaint}}>{b.h}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── SETTINGS VIEW ────────────────────────────────────────────────────────────
function SettingsView({wakeTime,setWakeTime,sleepTime,setSleepTime,freeThreshold,setFreeThreshold,categories,setCategories,themeId,setThemeId,googleSyncStatus,onSyncNow,onSyncSpreadsheet,onEditCat,onAddCat}){
  const statusLabel={idle:"未同期",loading:"同期中…",ok:"同期済み ✓",error:"失敗 ⚠️"}[googleSyncStatus]||"";
  const statusColor={idle:C.textSub,loading:C.amber,ok:C.green,error:C.red}[googleSyncStatus]||C.textSub;

  return(
    <div style={{padding:16}}>
      <SG title="カラーテーマ">
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {THEMES.map(t=>{
            const active=themeId===t.id;
            return(
              <button key={t.id} onClick={()=>setThemeId(t.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",borderRadius:12,cursor:"pointer",background:active?C.accentDim:"transparent",border:`1.5px solid ${active?C.accent:C.border}`,textAlign:"left"}}>
                <span style={{fontSize:22}}>{t.emoji}</span>
                <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:active?C.accent:C.text}}>{t.name}</div><div style={{fontSize:11,color:C.textSub}}>{t.desc}</div></div>
                <div style={{display:"flex",gap:3}}>{[t.accent,t.green,t.pink,t.red].map((col,i)=><div key={i} style={{width:10,height:10,borderRadius:"50%",background:col}}/>)}</div>
                {active&&<div style={{width:18,height:18,borderRadius:"50%",background:C.accent,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="checkmark" size={10} color="#fff"/></div>}
              </button>
            );
          })}
        </div>
      </SG>
      <SG title="起床・就寝 (目安基準時間)">
        <div style={{display:"flex",gap:12}}>
          <div style={{flex:1}}><FL><Icon name="sun" size={12} color={C.amber}/> 起床</FL><input type="time" value={wakeTime} onChange={e=>setWakeTime(e.target.value)} style={inputSt()}/></div>
          <div style={{flex:1}}><FL><Icon name="moon" size={12} color={C.textSub}/> 就寝</FL><input type="time" value={sleepTime} onChange={e=>setSleepTime(e.target.value)} style={inputSt()}/></div>
        </div>
      </SG>
      <SG title="空き時間の表示">
        <FL>何分以上の空き時間を表示するか</FL>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <input type="range" min={5} max={120} step={5} value={freeThreshold} onChange={e=>setFreeThreshold(Number(e.target.value))} style={{flex:1,accentColor:C.accent}}/>
          <span style={{fontSize:16,fontWeight:700,color:C.accent,minWidth:50}}>{freeThreshold}分</span>
        </div>
      </SG>
      <SG title="カテゴリ管理">
        {categories.map(cat=>(
          <div key={cat.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:12,height:12,borderRadius:"50%",background:cat.color}}/><span style={{fontSize:14,fontWeight:600}}>{cat.name}</span></div>
            {cat.id!=="google"&&<Chip icon="edit" label="編集" color={C.accent} onClick={()=>onEditCat(cat)}/>}
          </div>
        ))}
        <button onClick={onAddCat} style={{marginTop:10,width:"100%",padding:10,background:C.accentDim,border:`1px dashed ${C.accentGlow}`,borderRadius:10,color:C.accent,fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          <Icon name="plus" size={14} color={C.accent}/> カテゴリを追加
        </button>
      </SG>
      <SG title="データ管理">
        <div style={{padding:"10px 12px",borderRadius:10,background:"#5865F222",border:"1px solid #5865F244",marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:"#5865F2",marginBottom:2,display:"flex",alignItems:"center",gap:5}}>
            <Icon name="bell" size={13} color="#5865F2"/>Discord通知
          </div>
          <div style={{fontSize:11,color:C.textSub,lineHeight:1.6}}>
            タスクに設定した通知タイミングで、Discordにメッセージが届きます。<br/>
            通知はCloudflare Workerが毎分自動で確認・送信します。<br/>
            アプリを閉じていても通知されます。
          </div>
        </div>
        <div style={{padding:"10px 12px",borderRadius:10,background:"#4285F422",border:"1px solid #4285F444",marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <div style={{fontSize:12,fontWeight:700,color:"#4285F4"}}>🗓️ Googleカレンダー同期</div>
            <span style={{fontSize:11,color:statusColor,fontWeight:600}}>{statusLabel}</span>
          </div>
          <div style={{fontSize:11,color:C.textSub,lineHeight:1.5,marginBottom:8}}>選択した日付のGoogle予定を自動で読み込みます。</div>
          <button onClick={onSyncNow} style={{fontSize:11,color:"#4285F4",background:"#4285F422",border:"1px solid #4285F444",borderRadius:8,padding:"5px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontWeight:600}}>
            <Icon name="sync" size={12} color="#4285F4"/>今すぐ同期
          </button>
        </div>
        <div style={{padding:"10px 12px",borderRadius:10,background:C.greenDim,border:`1px solid ${C.green}44`, marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:C.green,marginBottom:2}}>💾 自動保存オン</div>
          <div style={{fontSize:11,color:C.textSub,lineHeight:1.5}}>手動で追加したタスク・設定は自動でこの端末に保存されます。</div>
        </div>
        <button onClick={onSyncSpreadsheet} style={{width:"100%",padding:11,borderRadius:10,fontSize:13,fontWeight:600,background:C.accentDim,border:`1px solid ${C.accent}44`,color:C.accent,cursor:"pointer"}}>
          📤 Supabaseサーバーへ手動同期・バックアップ
        </button>
      </SG>
    </div>
  );
}
function SG({title,children}){return<div style={{background:C.surface,borderRadius:16,padding:"14px 16px",marginBottom:12}}><div style={{fontSize:12,fontWeight:700,color:C.textSub,marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>{title}</div>{children}</div>;}
function FL({children}){return<div style={{fontSize:11,color:C.textSub,marginBottom:5,display:"flex",alignItems:"center",gap:4}}>{children}</div>;}

// ─── BOTTOM NAV ───────────────────────────────────────────────────────────────
function BottomNav({tab,setTab}){
  const items=[{id:"timeline",icon:"today",label:"今日"},{id:"later",icon:"later",label:"あとで"},{id:"stats",icon:"chart",label:"統計"},{id:"settings",icon:"gear",label:"設定"}];
  return(
    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100}}>
      {items.map(item=>(
        <button key={item.id} onClick={()=>setTab(item.id)} style={{flex:1,padding:"11px 0 8px",border:"none",background:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          <Icon name={item.icon} size={22} color={tab===item.id?C.accent:C.textSub}/>
          <span style={{fontSize:10,fontWeight:600,color:tab===item.id?C.accent:C.textSub}}>{item.label}</span>
          {tab===item.id&&<div style={{width:18,height:2,background:C.accent,borderRadius:2}}/>}
        </button>
      ))}
    </div>
  );
}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function BottomSheet({title,onClose,children}){
  return(
    <div style={{position:"fixed",inset:0,background:"#00000080",zIndex:200,display:"flex",alignItems:"flex-end"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:C.surface,borderRadius:"22px 22px 0 0",padding:"22px 18px",width:"100%",maxWidth:430,margin:"0 auto",maxHeight:"92vh",overflowY:"auto",boxSizing:"border-box"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div style={{fontSize:17,fontWeight:800}}>{title}</div>
          <button onClick={onClose} style={{background:C.border,border:"none",borderRadius:"50%",width:28,height:28,color:C.text,cursor:"pointer",fontSize:14}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Field({label,children,style:s}){return<div style={{marginBottom:14,...s}}><div style={{fontSize:11,color:C.textSub,marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:0.8}}>{label}</div>{children}</div>;}
function Pill({label,active,color,bg,onClick}){return<button onClick={onClick} style={{padding:"5px 12px",borderRadius:10,fontSize:12,fontWeight:700,background:active?bg:"transparent",border:`1px solid ${active?color:C.border}`,color:active?color:C.textSub,cursor:"pointer"}}>{label}</button>;}

function TaskModal({initial,categories,selectedDateKey,onClose,onSave}){
  const visibleCats=categories.filter(c=>c.id!=="google");
  const def={title:"",time:toTime(nowMin()+30),duration:30,categoryId:visibleCats[0]?.id||"other",done:false,pinned:false,dateKey:null,note:"",remindMinutes:null,repeat:{type:"none",interval:1,days:[],end:{type:"none"}}};
  const [f,setF]=useState(initial?{...def,...initial}:def);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setR=(k,v)=>setF(p=>({...p,repeat:{...p.repeat,[k]:v}}));
  const setRE=(k,v)=>setF(p=>({...p,repeat:{...p.repeat,end:{...p.repeat.end,[k]:v}}}));
  const isDateSpecific = f.repeat?.type === "none";

  return(
    <BottomSheet title={initial?"タスクを編集":"タスクを追加"} onClose={onClose}>
      <Field label="タイトル"><input value={f.title} onChange={e=>set("title",e.target.value)} placeholder="何をしますか？" style={inputSt()} autoFocus/></Field>
      <div style={{display:"flex",gap:10}}>
        <Field label="開始時刻" style={{flex:1}}><input type="time" value={f.time} onChange={e=>set("time",e.target.value)} style={inputSt()}/></Field>
        <Field label="所要時間(分)" style={{flex:1}}><input type="number" value={f.duration} min={5} max={480} step={5} onChange={e=>set("duration",Number(e.target.value))} style={inputSt()}/></Field>
      </div>
      <Field label="カテゴリ"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{visibleCats.map(cat=><Pill key={cat.id} label={cat.name} active={f.categoryId===cat.id} color={cat.color} bg={cat.bg} onClick={()=>set("categoryId",cat.id)}/>)}</div></Field>
      <Field label="繰り返し">
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
          {[{v:"none",l:"なし（日付指定）"},{v:"daily",l:"毎日"},{v:"weekday",l:"平日"},{v:"weekly",l:"毎週"},{v:"monthly",l:"毎月"},{v:"yearly",l:"毎年"}].map(o=><Pill key={o.v} label={o.l} active={f.repeat.type===o.v} color={C.accent} bg={C.accentDim} onClick={()=>setR("type",o.v)}/>)}
        </div>
        {isDateSpecific && (
          <div style={{marginBottom:8}}>
            <FL>表示する日付</FL>
            <input type="date" value={f.dateKey||selectedDateKey} onChange={e=>set("dateKey",e.target.value)} style={inputSt()} />
          </div>
        )}
        {!isDateSpecific&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{fontSize:11,color:C.textSub,minWidth:40}}>間隔</span>
              <input type="range" min={1} max={30} value={f.repeat.interval} onChange={e=>setR("interval",Number(e.target.value))} style={{flex:1,accentColor:C.accent}}/>
              <span style={{color:C.accent,fontWeight:700,minWidth:30}}>{f.repeat.interval}</span>
            </div>
            {f.repeat.type==="weekly"&&(
              <div style={{display:"flex",gap:6,marginBottom:8}}>
                {WEEKDAY_LABELS.map((d,i)=>{const sel=(f.repeat.days||[]).includes(i);return<button key={i} onClick={()=>setR("days",sel?f.repeat.days.filter(x=>x!==i):[...(f.repeat.days||[]),i])} style={{width:34,height:34,borderRadius:"50%",border:`1px solid ${sel?C.accent:C.border}`,background:sel?C.accentDim:"transparent",color:sel?C.accent:C.textSub,fontSize:12,fontWeight:700,cursor:"pointer"}}>{d}</button>;})}
              </div>
            )}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
              {[{v:"none",l:"終了なし"},{v:"until",l:"日付指定"},{v:"count",l:"回数指定"}].map(o=><Pill key={o.v} label={o.l} active={f.repeat.end?.type===o.v} color={C.accent} bg={C.accentDim} onClick={()=>setRE("type",o.v)}/>)}
            </div>
            {f.repeat.end?.type==="until"&&<input type="date" value={f.repeat.end.until||""} onChange={e=>setRE("until",e.target.value)} style={inputSt()}/>}
            {f.repeat.end?.type==="count"&&<div style={{display:"flex",alignItems:"center",gap:10}}><input type="number" min={1} max={100} value={f.repeat.end.count||1} onChange={e=>setRE("count",Number(e.target.value))} style={{...inputSt(),width:80}}/><span style={{color:C.textSub,fontSize:13}}>回まで</span></div>}
          </>
        )}
      </Field>
      <Field label="メモ（任意）"><input value={f.note} onChange={e=>set("note",e.target.value)} placeholder="補足など" style={inputSt()}/></Field>
      <Field label="🔔 Discord通知タイミング">
        <div style={{fontSize:11,color:C.textSub,marginBottom:8}}>タスクの何分前にDiscordへ通知しますか？</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {[
            {v:null, l:"なし"},
            {v:0,    l:"開始時"},
            {v:5,    l:"5分前"},
            {v:10,   l:"10分前"},
            {v:15,   l:"15分前"},
            {v:30,   l:"30分前"},
            {v:-1,   l:"カスタム"},
          ].map(o=>{
            const isCustom = o.v === -1;
            const active = isCustom
              ? (f.remindMinutes != null && ![null,0,5,10,15,30].includes(f.remindMinutes))
              : f.remindMinutes === o.v;
            return(
              <Pill key={String(o.v)} label={o.l} active={active} color={C.accent} bg={C.accentDim}
                onClick={()=>{ if(isCustom){ set("remindMinutes", 20); } else { set("remindMinutes", o.v); } }}/>
            );
          })}
        </div>
        {f.remindMinutes != null && ![null,0,5,10,15,30].includes(f.remindMinutes) && (
          <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
            <input type="number" min={1} max={120} value={f.remindMinutes}
              onChange={e=>set("remindMinutes",Number(e.target.value))}
              style={{...inputSt(),width:80}}/>
            <span style={{fontSize:13,color:C.textSub}}>分前</span>
          </div>
        )}
      </Field>
      <div style={{marginBottom:16}}>
        <button onClick={()=>set("pinned",!f.pinned)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:10,fontSize:12,fontWeight:700,background:f.pinned?C.pinkDim:C.surface2,border:`1px solid ${f.pinned?C.pink:C.border}`,color:f.pinned?C.pink:C.textSub,cursor:"pointer"}}>
          <Icon name={f.pinned?"pinFill":"pin"} size={13} color={f.pinned?C.pink:C.textSub}/>{f.pinned?"ピン留め中":"ピン留めする"}
        </button>
      </div>
      <button onClick={()=>{if(f.title.trim()){const saved={...f};if(saved.repeat?.type==="none"&&!saved.dateKey)saved.dateKey=selectedDateKey;onSave(saved);}}} style={{width:"100%",padding:14,borderRadius:14,fontSize:15,fontWeight:700,background:`linear-gradient(135deg,${C.accent},${C.accent}bb)`,border:"none",color:"#fff",cursor:"pointer"}}>{initial?"更新する":"追加する"}</button>
    </BottomSheet>
  );
}

function LaterModal({initial,categories,onClose,onSave}){
  const visibleCats=categories.filter(c=>c.id!=="google");
  const [title,setTitle]=useState(initial?.title||"");
  const [catId,setCatId]=useState(initial?.categoryId||visibleCats[0]?.id||"other");
  const [pinned,setPinned]=useState(initial?.pinned||false);
  return(
    <BottomSheet title={initial?"あとでやるを編集":"あとでやるに追加"} onClose={onClose}>
      <Field label="タイトル"><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="いつかやりたいこと" style={inputSt()} autoFocus/></Field>
      <Field label="カテゴリ"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{visibleCats.map(cat=><Pill key={cat.id} label={cat.name} active={catId===cat.id} color={cat.color} bg={cat.bg} onClick={()=>setCatId(cat.id)}/>)}</div></Field>
      <div style={{marginBottom:16}}>
        <button onClick={()=>setPinned(p=>!p)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:10,fontSize:12,fontWeight:700,background:pinned?C.pinkDim:C.surface2,border:`1px solid ${pinned?C.pink:C.border}`,color:pinned?C.pink:C.textSub,cursor:"pointer"}}>
          <Icon name={pinned?"pinFill":"pin"} size={13} color={pinned?C.pink:C.textSub}/>{pinned?"ピン留め中":"ピン留めする"}
        </button>
      </div>
      <button onClick={()=>{if(title.trim())onSave({...initial,title:title.trim(),categoryId:catId,pinned});}} style={{width:"100%",padding:14,borderRadius:14,fontSize:15,fontWeight:700,background:`linear-gradient(135deg,${C.amber},${C.amber}bb)`,border:"none",color:C.dark?"#000":"#fff",cursor:"pointer"}}>{initial?"更新する":"追加する"}</button>
    </BottomSheet>
  );
}

const PRESET_COLORS=["#d0a727","#667572","#a1bad0","#5a7a9a","#8a6e3a","#b85c4a","#9aaba8","#c49020","#7a9e8a","#6a7f8c"];
function CategoryModal({initial,onClose,onSave,onDelete}){
  const [name,setName]=useState(initial?.name||"");
  const [color,setColor]=useState(initial?.color||PRESET_COLORS[0]);
  return(
    <BottomSheet title={initial?"カテゴリを編集":"カテゴリを追加"} onClose={onClose}>
      <Field label="名前"><input value={name} onChange={e=>setName(e.target.value)} placeholder="カテゴリ名" style={inputSt()} autoFocus/></Field>
      <Field label="カラー">
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{PRESET_COLORS.map(c=><button key={c} onClick={()=>setColor(c)} style={{width:32,height:32,borderRadius:"50%",background:c,border:`3px solid ${color===c?"#fff":"transparent"}`,cursor:"pointer",outline:"none"}}/>)}</div>
        <div style={{marginTop:8,display:"flex",alignItems:"center",gap:10}}><div style={{width:24,height:24,borderRadius:"50%",background:color}}/><span style={{fontSize:11,color:C.textSub}}>{name||"（名前なし）"}</span></div>
      </Field>
      <button onClick={()=>{if(name.trim())onSave({...initial,name:name.trim(),color,bg:color+"22"});}} style={{width:"100%",padding:14,borderRadius:14,fontSize:15,fontWeight:700,background:`linear-gradient(135deg,${color},${color}cc)`,border:"none",color:"#fff",cursor:"pointer",marginBottom:10}}>{initial?"更新する":"追加する"}</button>
      {initial&&<button onClick={()=>{if(window.confirm(`「${initial.name}」を削除しますか？`))onDelete(initial.id);}} style={{width:"100%",padding:11,borderRadius:14,fontSize:13,fontWeight:600,background:C.redDim,border:`1px solid ${C.red}44`,color:C.red,cursor:"pointer"}}>削除する</button>}
    </BottomSheet>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
